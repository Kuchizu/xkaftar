name: iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter-client
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing files
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          GOOGLE_SERVICE_INFO: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          echo "$GOOGLE_SERVICE_INFO" | base64 -D > ios/Runner/GoogleService-Info.plist
          echo "$PROFILE" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          echo "$P12" | base64 -D > "$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

      - name: Build
        run: flutter build ios --release --no-codesign --dart-define=APP_ENV=production --dart-define=API_BASE_URL=https://kaftar.kuchizu.com

      - name: Sign
        run: |
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' "$RUNNER_TEMP/profile.plist" > "$RUNNER_TEMP/entitlements.plist"
          APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          BUNDLE_ID="${APP_ID#*.}"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/build.keychain-db" | head -1 | awk '{print $2}')
          mkdir -p "$RUNNER_TEMP/Payload"
          APP="$RUNNER_TEMP/Payload/Runner.app"
          cp -R build/ios/iphoneos/Runner.app "$APP"
          cp "$PROFILE" "$APP/embedded.mobileprovision"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $BUNDLE_ID" "$APP/Info.plist"
          find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign "$IDENTITY" {} \;
          codesign --force --sign "$IDENTITY" --entitlements "$RUNNER_TEMP/entitlements.plist" "$APP"
          codesign --verify --deep --strict "$APP"
          cd "$RUNNER_TEMP" && zip -qry Kaftar.ipa Payload
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" > version.txt
          echo "$BUNDLE_ID" > bundle_id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Kaftar-ios
          retention-days: 1
          path: |
            ${{ runner.temp }}/Kaftar.ipa
            ${{ runner.temp }}/version.txt
            ${{ runner.temp }}/bundle_id.txt
